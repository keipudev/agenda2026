version: '3.8'

services:
  agenda:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agenda2026
    restart: unless-stopped
    environment:
      - FLASK_DEBUG=0
      - AGENDA_PORT=5000
    volumes:
      - agenda-db:/app/database
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - agenda-network

  nginx:
    image: nginx:alpine
    container_name: agenda-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      agenda:
        condition: service_healthy
    networks:
      - agenda-network

volumes:
  agenda-db:

networks:
  agenda-network:
    driver: bridge: