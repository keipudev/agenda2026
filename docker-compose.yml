services:
  agenda:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agenda2026
    restart: unless-stopped
    environment:
      - FLASK_DEBUG=0
      - AGENDA_PORT=5000
      - DATABASE_URL=sqlite:///database/agenda.db
      - ALLOWED_ORIGINS=http://localhost:5000,http://localhost:3000
    volumes:
      - agenda2026-db:/app/database
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  agenda2026-db:
    name: agenda2026-db
