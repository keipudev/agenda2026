version: '3.8'

services:
  agenda:
    build:
      context: .
      dockerfile: Dockerfile.windows
    container_name: agenda2026
    restart: unless-stopped
    environment:
      - FLASK_DEBUG=0
      - AGENDA_PORT=5000
    volumes:
      - type: volume
        source: agenda-db
        target: C:\app\database
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  agenda-db:
